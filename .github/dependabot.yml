# Dependabot: 생태계별로 업데이트를 PR 1개로 묶고 월 1회만 검사
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      gradle-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]   # 메이저 버전은 제외 (코드 수정이 필요한 업데이트)
      gradle-security:
        applies-to: security-updates       # 보안 업데이트도 한 PR로 묶음
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/crawlingServer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      pip-all:
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ["*"]
