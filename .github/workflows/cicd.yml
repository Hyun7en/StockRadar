name: CI

# 배포 서버(Elastic Beanstalk)는 종료되어 배포 단계는 제거함. 빌드(컴파일) 검증만 수행.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트는 DB·Redis·Kafka가 필요해 CI에서는 제외
      - name: Build with Gradle
        run: ./gradlew clean build -x test
