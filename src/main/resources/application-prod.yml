server:
  # ELB/nginx 뒤에서 실제 클라이언트 IP를 사용 (rate limit 기준)
  forward-headers-strategy: native

spring:
  application:
    name: stockradar

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 예) jdbc:mysql://<host>:3306/stockradar?characterEncoding=UTF-8&sslMode=REQUIRED&serverTimezone=Asia/Seoul
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  thymeleaf:
    cache: true

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    hibernate:
      # 운영 스키마는 자동 변경하지 않음 (필요 시 JPA_DDL_AUTO=validate 등으로 지정)
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            scope:
              - name
              - email
            redirect-uri: "https://${DOMAIN}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic

          discord:
            client-id: ${DISCORD_CLIENT_ID}
            client-secret: ${DISCORD_CLIENT_SECRET}
            client-name: Discord
            scope:
              - identify
              - email
            redirect-uri: "https://${DOMAIN}/login/oauth2/code/discord"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "https://${DOMAIN}/login/oauth2/code/google"
            client-name: Google
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # Kafka 설정
  kafka:
    # 브로커는 앱 서버에서만 접근 가능하도록 보안그룹/네트워크로 제한할 것
    bootstrap-servers: ${KAFKA_BROKER}
    # SASL/SSL 사용 시 properties에 security.protocol, sasl.mechanism, sasl.jaas.config 추가
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.example.stockradar.feature.notification.dto"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    elasticsearch:
      enabled: false # 불필요한 health check fail 로그 차단

##### 로그 설정
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.example.stockradar: INFO
    org.thymeleaf: INFO
    org.springframework.boot.web.servlet: ERROR
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    dateformat: "yyyy-MM-dd HH:mm:ss,Asia/Seoul"

  file:
    name: logs/app.log
    path: logs

  logback:
    rollingpolicy:
      file-name-pattern: "StockRadar.%d{yyyy-MM-dd}.%i.log"
      max-history: 10

jwt:
  secret: ${JWT_SECRET}

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN}

DOMAIN: ${DOMAIN}

app:
  base-url: https://${DOMAIN}
  cookie:
    secure: true
