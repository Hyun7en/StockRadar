server:
  port: 8099  # 배포 5000 개발 8099
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: stockradar

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true
    cache: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 프로젝트 루트의 .env(KEY=VALUE)를 프로퍼티로 읽음. 파일이 없으면 무시 (git에는 .env.example만 커밋)
  config:
    import: optional:file:.env[.properties]

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    # show_sql: true # System.out 방식 (이거 말고 logging.level.org.hibernate.SQL 설정을 권장)
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
      dialect: org.hibernate.dialect.MySQL8Dialect

  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 비밀값은 전부 환경변수(.env)에서 주입
jwt:
  secret: ${JWT_SECRET:}

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:}

coolsms:
  api-key: ${COOLSMS_API_KEY:}
  api-secret: ${COOLSMS_API_SECRET:}
  sender: ${COOLSMS_SENDER:}

app:
  # 비밀번호 재설정 메일 링크 등에 쓰는 외부 접속 주소
  base-url: ${APP_BASE_URL:http://localhost:8099}
  cookie:
    # HTTPS 환경에서는 반드시 true
    secure: ${COOKIE_SECURE:true}

management:
  health:
    elasticsearch:
      enabled: false # 불필요한 health check fail 로그 차단

# 추가 공통 설정 (로깅 레벨, 국제화, 배치, 캐시 등)
##### log setting
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.example.stockradar: DEBUG
    org.thymeleaf: INFO
    org.springframework.boot.web.servlet: ERROR
    org.hibernate.SQL: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    dateformat: "yyyy-MM-dd HH:mm:ss,Asia/Seoul" # ms는 제외함

  # file log
  file:
    name: logs/app.log
    path: logs

  logback:
    rollingpolicy:
      file-name-pattern: "StockRadar.%d{yyyy-MM-dd}.%i.log"
      max-history: 60

  spring:
    output:
      ansi:
        enabled: ALWAYS